<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sentinel-Ops | Neural Threat Command</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050708;--bg1:#080d10;--bg2:#0b1318;--bg3:#0f1c24;
  --border:#1a2d3a;--border2:#1e3545;
  --c:#00e5ff;--c2:#00ff88;--c3:#ff4757;--c4:#ffa502;--c5:#7bed9f;
  --tx:#b8d4e0;--txd:#3d6275;--txb:#e8f4f8;
  --font-head:'Syne',sans-serif;
  --font-mono:'Space Mono',monospace;
  --font-data:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font-data);overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}

/* noise overlay */
body::before{content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:0.4}

/* ── HEADER ── */
.hdr{display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:52px;border-bottom:1px solid var(--border);
  background:rgba(5,7,8,0.98);backdrop-filter:blur(12px);
  position:relative;z-index:200;flex-shrink:0}
.hdr-logo{display:flex;align-items:center;gap:14px}
.hdr-shield{width:32px;height:32px;position:relative;flex-shrink:0}
.hdr-shield svg{width:100%;height:100%}
.brand{font-family:var(--font-head);font-size:15px;font-weight:800;
  letter-spacing:4px;color:var(--c);text-transform:uppercase}
.brand-sub{font-size:9px;letter-spacing:3px;color:var(--txd);
  font-family:var(--font-mono);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:20px}
.sys-stat{display:flex;align-items:center;gap:6px;font-size:10px;
  letter-spacing:2px;color:var(--txd);font-family:var(--font-mono)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--c2);
  animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hdr-time{font-family:var(--font-mono);font-size:11px;color:var(--txd);
  letter-spacing:1px;min-width:75px;text-align:right}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:300px 1fr 340px;
  flex:1;overflow:hidden;position:relative;z-index:1}

/* ── LEFT PANEL ── */
.left{border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;background:var(--bg1)}

.panel-label{font-size:9px;letter-spacing:3px;color:var(--txd);
  font-family:var(--font-mono);text-transform:uppercase}

.submit-zone{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0}
.threat-area{width:100%;background:var(--bg2);border:1px solid var(--border2);
  border-radius:4px;color:var(--tx);font-family:var(--font-mono);font-size:11px;
  line-height:1.7;padding:12px;resize:none;outline:none;min-height:110px;
  transition:border-color .2s;margin-top:10px}
.threat-area:focus{border-color:var(--c)}
.threat-area::placeholder{color:var(--txd);font-style:italic}

.launch-btn{width:100%;margin-top:10px;padding:11px;background:transparent;
  border:1px solid var(--c);border-radius:3px;color:var(--c);
  font-family:var(--font-head);font-size:12px;font-weight:700;
  letter-spacing:4px;cursor:pointer;position:relative;overflow:hidden;
  transition:all .25s;text-transform:uppercase}
.launch-btn::after{content:'';position:absolute;inset:0;
  background:var(--c);transform:scaleX(0);transform-origin:left;
  transition:transform .25s;z-index:-1}
.launch-btn:hover{color:var(--bg)}
.launch-btn:hover::after{transform:scaleX(1)}
.launch-btn:disabled{opacity:.3;cursor:not-allowed;border-color:var(--txd);color:var(--txd)}
.launch-btn:disabled::after{display:none}

.jobs-header{padding:14px 20px 8px;flex-shrink:0}
.job-scroll{flex:1;overflow-y:auto;padding:8px 12px 12px}
.job-scroll::-webkit-scrollbar{width:3px}
.job-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

.job-card{padding:11px 14px;border:1px solid var(--border);border-radius:4px;
  margin-bottom:6px;cursor:pointer;transition:all .15s;background:var(--bg2)}
.job-card:hover{border-color:var(--border2);background:var(--bg3)}
.job-card.sel{border-color:var(--c);background:var(--bg3);
  box-shadow:inset 2px 0 0 var(--c)}
.job-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.job-short{font-family:var(--font-mono);font-size:9px;color:var(--txd)}
.job-excerpt{font-size:11px;color:var(--tx);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── STATUS BADGES ── */
.badge{font-family:var(--font-mono);font-size:9px;padding:2px 7px;
  border-radius:2px;letter-spacing:1px;font-weight:700;white-space:nowrap}
.badge-CRITICAL{background:rgba(255,71,87,.12);color:#ff4757;border:1px solid rgba(255,71,87,.4)}
.badge-HIGH    {background:rgba(255,165,2,.12); color:#ffa502;border:1px solid rgba(255,165,2,.4)}
.badge-MEDIUM  {background:rgba(0,229,255,.1);  color:var(--c);border:1px solid rgba(0,229,255,.3)}
.badge-LOW     {background:rgba(0,255,136,.1);  color:var(--c2);border:1px solid rgba(0,255,136,.3)}
.badge-pending {background:rgba(61,98,117,.2);  color:var(--txd);border:1px solid var(--border)}
.badge-running,.badge-looping{background:rgba(0,229,255,.08);color:var(--c);
  border:1px solid rgba(0,229,255,.25);animation:blink 1s infinite}
.badge-complete{background:rgba(0,255,136,.08);color:var(--c2);border:1px solid rgba(0,255,136,.25)}
.badge-failed  {background:rgba(255,71,87,.08); color:var(--c3);border:1px solid rgba(255,71,87,.25)}

/* ── CENTER PANEL ── */
.center{overflow-y:auto;background:var(--bg);position:relative}
.center::-webkit-scrollbar{width:4px}
.center::-webkit-scrollbar-thumb{background:var(--border2)}

.empty-center{height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;color:var(--txd);text-align:center}
.empty-glyph{font-size:56px;opacity:.15;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.empty-title{font-family:var(--font-head);font-size:18px;font-weight:700;
  letter-spacing:3px;color:var(--txd);text-transform:uppercase}
.empty-hint{font-size:11px;font-family:var(--font-mono);max-width:280px;
  line-height:1.7;opacity:.5}

/* ── PIPELINE VISUALIZATION ── */
.pipeline-wrap{padding:24px 28px 0;flex-shrink:0}
.pipeline-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.pipe-title{font-family:var(--font-head);font-size:11px;font-weight:700;
  letter-spacing:3px;color:var(--txd);text-transform:uppercase}
.pipe-status{font-family:var(--font-mono);font-size:10px}

.pipeline{display:flex;align-items:center;gap:0;margin-bottom:24px;
  background:var(--bg1);border:1px solid var(--border);border-radius:4px;
  overflow:hidden}
.agent-node{flex:1;padding:14px 10px;text-align:center;position:relative;
  transition:all .3s;border-right:1px solid var(--border);cursor:default}
.agent-node:last-child{border-right:none}
.agent-node.done{background:rgba(0,255,136,.04)}
.agent-node.active{background:rgba(0,229,255,.06);animation:node-pulse 1.5s infinite}
.agent-node.idle{opacity:.45}
@keyframes node-pulse{
  0%,100%{background:rgba(0,229,255,.06)}
  50%{background:rgba(0,229,255,.12)}}
.agent-icon{font-size:20px;margin-bottom:6px;display:block;line-height:1}
.agent-name{font-family:var(--font-head);font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase}
.agent-node.done .agent-name{color:var(--c2)}
.agent-node.active .agent-name{color:var(--c)}
.agent-node.idle .agent-name{color:var(--txd)}
.agent-dur{font-size:9px;color:var(--txd);font-family:var(--font-mono);margin-top:3px}
.agent-connector{width:20px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:var(--border2);font-size:14px}
.node-ring{position:absolute;inset:0;border-radius:0;pointer-events:none}
.agent-node.active .node-ring{
  box-shadow:inset 0 0 0 1px rgba(0,229,255,.4);animation:ring-pulse 1.5s infinite}
@keyframes ring-pulse{0%,100%{box-shadow:inset 0 0 0 1px rgba(0,229,255,.2)}
  50%{box-shadow:inset 0 0 0 1px rgba(0,229,255,.7)}}

/* ── MESSAGES ── */
.msgs-section{padding:0 28px 20px}
.msgs-feed{display:flex;flex-direction:column;gap:10px}
.msg-row{display:grid;grid-template-columns:90px 1fr;gap:14px;
  align-items:start;animation:slide-in .3s ease}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.msg-agent{font-family:var(--font-head);font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;padding-top:3px;text-align:right}
.msg-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:3px;
  padding:10px 14px;font-family:var(--font-mono);font-size:11px;
  line-height:1.65;color:var(--tx)}
.msg-bubble.sup{border-color:rgba(0,229,255,.2);background:rgba(0,229,255,.04)}
.msg-bubble.sco{border-color:rgba(0,255,136,.2);background:rgba(0,255,136,.04)}
.msg-bubble.ana{border-color:rgba(255,165,2,.2);background:rgba(255,165,2,.04)}
.msg-bubble.rep{border-color:rgba(255,71,87,.2);background:rgba(255,71,87,.04)}
.msg-ts{font-size:9px;color:var(--txd);margin-top:4px;font-family:var(--font-mono)}

/* ── FACT SHEET ── */
.fact-section{padding:0 28px 28px}
.fact-card{border:1px solid var(--border2);border-radius:4px;overflow:hidden;
  animation:reveal .4s ease}
@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fact-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)}
.fact-title{font-family:var(--font-head);font-size:13px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase}
.fact-header.sev-CRITICAL{background:rgba(255,71,87,.08);border-bottom-color:rgba(255,71,87,.2)}
.fact-header.sev-HIGH    {background:rgba(255,165,2,.06);border-bottom-color:rgba(255,165,2,.2)}
.fact-header.sev-MEDIUM  {background:rgba(0,229,255,.05);border-bottom-color:rgba(0,229,255,.15)}
.fact-header.sev-LOW     {background:rgba(0,255,136,.05);border-bottom-color:rgba(0,255,136,.15)}

.fact-body{padding:20px}
.metrics-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:12px;text-align:center}
.metric-label{font-size:8px;letter-spacing:2px;color:var(--txd);
  font-family:var(--font-mono);text-transform:uppercase;margin-bottom:6px}
.metric-val{font-family:var(--font-head);font-size:22px;font-weight:800;color:var(--c)}
.metric-val.sev-CRITICAL{color:#ff4757}
.metric-val.sev-HIGH    {color:#ffa502}
.metric-val.sev-LOW     {color:#00ff88}

.exec-summary{font-size:12px;line-height:1.8;color:var(--tx);
  border-left:2px solid var(--c);padding:12px 16px;background:var(--bg2);
  border-radius:0 3px 3px 0;margin-bottom:18px;font-family:var(--font-mono)}

.fact-section-head{font-size:9px;letter-spacing:3px;color:var(--txd);
  font-family:var(--font-mono);text-transform:uppercase;margin-bottom:10px}

.ip-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ip-chip{font-family:var(--font-mono);font-size:11px;padding:4px 10px;
  background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.25);
  border-radius:3px;color:#ff6b7a}

.recs{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.rec{display:flex;gap:10px;align-items:flex-start;font-size:11px;
  color:var(--tx);line-height:1.6;font-family:var(--font-mono)}
.rec-n{font-size:9px;color:var(--c2);background:rgba(0,255,136,.08);
  border:1px solid rgba(0,255,136,.25);border-radius:2px;
  padding:1px 6px;flex-shrink:0;margin-top:2px;font-family:var(--font-mono)}

.mitre-chips{display:flex;flex-wrap:wrap;gap:8px}
.mitre-chip{font-family:var(--font-mono);font-size:10px;padding:4px 10px;
  background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);
  border-radius:2px;color:var(--c)}

/* ── RIGHT PANEL ── */
.right{border-left:1px solid var(--border);overflow-y:auto;background:var(--bg1)}
.right::-webkit-scrollbar{width:3px}
.right::-webkit-scrollbar-thumb{background:var(--border2)}

.right-section{padding:18px 18px 0;border-bottom:1px solid var(--border);padding-bottom:18px}
.right-section:last-child{border-bottom:none}

.r-title{font-family:var(--font-head);font-size:10px;font-weight:700;
  letter-spacing:3px;text-transform:uppercase;color:var(--txd);margin-bottom:14px}

/* ── SPANS ── */
.span-row{display:grid;grid-template-columns:80px 1fr 50px;gap:8px;
  align-items:center;margin-bottom:8px}
.span-agent{font-family:var(--font-mono);font-size:10px;color:var(--c);font-weight:700}
.span-bar-bg{background:var(--bg3);border-radius:2px;height:5px;overflow:hidden}
.span-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.span-bar-fill.ok {background:linear-gradient(90deg,#1a8fa0,var(--c))}
.span-bar-fill.err{background:linear-gradient(90deg,var(--c3),#ff8c00)}
.span-dur{font-family:var(--font-mono);font-size:9px;color:var(--txd);text-align:right}

/* ── LOG SECTION ── */
.log-pre{font-family:var(--font-mono);font-size:10px;color:var(--c2);
  background:var(--bg);border:1px solid var(--border);border-radius:3px;
  padding:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;
  line-height:1.9;max-height:200px;overflow-y:auto}
.log-pre::-webkit-scrollbar{width:3px}
.log-pre::-webkit-scrollbar-thumb{background:var(--border2)}

/* ── INTEL ── */
.intel-item{font-size:10px;color:var(--tx);line-height:1.6;
  border-left:2px solid var(--border2);padding:6px 10px;margin-bottom:8px;
  font-family:var(--font-mono);background:var(--bg2);border-radius:0 3px 3px 0}

/* ── LIVE INDICATOR ── */
.live-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
  background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.15);
  border-radius:3px;margin:0 28px 16px;
  font-family:var(--font-mono);font-size:11px;color:var(--c)}
.spin{width:14px;height:14px;border:2px solid rgba(0,229,255,.2);
  border-top-color:var(--c);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ALERTS ── */
.err-bar{margin:0 28px 16px;padding:10px 14px;background:rgba(255,71,87,.08);
  border:1px solid rgba(255,71,87,.3);border-radius:3px;
  font-family:var(--font-mono);font-size:11px;color:var(--c3)}

/* ── SECTION DIVIDER ── */
.sec-divider{height:1px;background:var(--border);margin:0 28px 20px}

.center-inner{min-height:100%}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const API='';
const ago=ts=>{
  if(!ts)return'';
  const d=new Date(ts),diff=Math.floor((Date.now()-d)/1000);
  if(diff<60)return`${diff}s`;
  if(diff<3600)return`${Math.floor(diff/60)}m`;
  return d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
};
const shortId=id=>id?id.slice(0,8):'';
const AGENTS=['supervisor','scout','analyst','reporter'];
const AGENT_ICONS={supervisor:'⬡',scout:'◈',analyst:'◉',reporter:'◆'};
const AGENT_COLORS={supervisor:'var(--c)',scout:'var(--c2)',analyst:'var(--c4)',reporter:'var(--c3)'};
const AGENT_CLASS={supervisor:'sup',scout:'sco',analyst:'ana',reporter:'rep'};

function Clock(){
  const[t,setT]=useState(new Date());
  useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id)},[]);
  return<span className="hdr-time">{t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span>;
}

function Badge({status,severity}){
  if(severity&&['CRITICAL','HIGH','MEDIUM','LOW'].includes(severity))
    return<span className={`badge badge-${severity}`}>{severity}</span>;
  return<span className={`badge badge-${status}`}>{(status||'').toUpperCase()}</span>;
}

function Pipeline({messages,spans,status}){
  const done=new Set((messages||[]).map(m=>m.role));
  const lastMsg=(messages||[]).slice(-1)[0];
  const activeAgent=lastMsg&&!['complete','failed'].includes(status)?lastMsg.role:null;
  const spanMap={};
  (spans||[]).forEach(s=>{spanMap[s.agent]=(spanMap[s.agent]||0)+s.duration_ms});
  return(
    <div className="pipeline">
      {AGENTS.map((a,i)=>{
        const isDone=done.has(a)&&a!==activeAgent;
        const isActive=a===activeAgent||
          (!activeAgent&&status==='running'&&AGENTS.indexOf(lastMsg?.role||'')===i);
        const isIdle=!isDone&&!isActive;
        const cls=`agent-node ${isDone?'done':isActive?'active':'idle'}`;
        return(
          <div className={cls} key={a}>
            <div className="node-ring"/>
            <span className="agent-icon" style={{color:isDone?AGENT_COLORS[a]:isActive?AGENT_COLORS[a]:'var(--txd)'}}>
              {AGENT_ICONS[a]}
            </span>
            <div className="agent-name">{a}</div>
            {spanMap[a]&&<div className="agent-dur">{spanMap[a].toFixed(0)}ms</div>}
          </div>
        );
      })}
    </div>
  );
}

function Messages({messages}){
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),[messages?.length]);
  if(!messages?.length)return null;
  return(
    <div className="msgs-section">
      <div className="panel-label" style={{marginBottom:12}}>Event Log</div>
      <div className="msgs-feed">
        {messages.map((m,i)=>(
          <div className="msg-row" key={i}>
            <div className="msg-agent" style={{color:AGENT_COLORS[m.role]||'var(--txd)'}}>
              {AGENT_ICONS[m.role]} {m.role}
            </div>
            <div>
              <div className={`msg-bubble ${AGENT_CLASS[m.role]||''}`}>{m.content}</div>
              <div className="msg-ts">{ago(m.timestamp)}</div>
            </div>
          </div>
        ))}
        <div ref={endRef}/>
      </div>
    </div>
  );
}

function FactSheet({fs}){
  if(!fs)return null;
  const{summary,severity,recommendations,mitre_tactics,raw_markdown}=fs;
  const conf=raw_markdown?.match(/\*\*Confidence:\*\* (\d+%)/)?.[1]||'—';
  const score=raw_markdown?.match(/\*\*Anomaly Score:\*\* ([\d.]+)/)?.[1]||'—';
  const ips=raw_markdown?.match(/\*\*Suspicious IPs:\*\* ([^\n]+)/)?.[1]||'';
  const logMatch=raw_markdown?.match(/```\n([\s\S]*?)```/);
  const logs=logMatch?logMatch[1].trim():'';
  const intel=fs.raw_markdown?.match(/## Threat Intelligence\n([\s\S]*?)\n## /)?.[1]||'';
  const intelLines=intel.split('\n').filter(l=>l.trim().startsWith('-')).map(l=>l.replace(/^  - /,'').trim());
  return(
    <div className="fact-section">
      <div className="fact-card">
        <div className={`fact-header sev-${severity}`}>
          <span className="fact-title" style={{
            color:severity==='CRITICAL'?'#ff4757':severity==='HIGH'?'#ffa502':
                  severity==='LOW'?'#00ff88':'var(--c)'}}>
            ◆ Threat Fact Sheet
          </span>
          <Badge severity={severity}/>
        </div>
        <div className="fact-body">
          <div className="metrics-row">
            <div className="metric">
              <div className="metric-label">Severity</div>
              <div className={`metric-val sev-${severity}`}>{severity}</div>
            </div>
            <div className="metric">
              <div className="metric-label">Confidence</div>
              <div className="metric-val">{conf}</div>
            </div>
            <div className="metric">
              <div className="metric-label">Anomaly Score</div>
              <div className="metric-val">{score}</div>
            </div>
          </div>

          <div className="exec-summary">{summary}</div>

          {ips&&ips.toLowerCase()!=='none detected'&&(
            <div style={{marginBottom:18}}>
              <div className="fact-section-head">Suspicious IPs</div>
              <div className="ip-chips">
                {ips.split(',').map((ip,i)=>(
                  <span className="ip-chip" key={i}>{ip.trim()}</span>
                ))}
              </div>
            </div>
          )}

          {recommendations?.length>0&&(
            <div style={{marginBottom:18}}>
              <div className="fact-section-head">Recommendations</div>
              <div className="recs">
                {recommendations.map((r,i)=>(
                  <div className="rec" key={i}>
                    <span className="rec-n">{String(i+1).padStart(2,'0')}</span>{r}
                  </div>
                ))}
              </div>
            </div>
          )}

          {mitre_tactics?.length>0&&(
            <div>
              <div className="fact-section-head">MITRE ATT&CK</div>
              <div className="mitre-chips">
                {mitre_tactics.map((t,i)=><span className="mitre-chip" key={i}>{t}</span>)}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function RightPanel({job}){
  if(!job)return(
    <div className="right">
      <div style={{padding:'60px 18px',textAlign:'center',color:'var(--txd)'}}>
        <div style={{fontSize:32,marginBottom:12,opacity:.3}}>◈</div>
        <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:2}}>
          SELECT A JOB<br/>TO VIEW DETAILS
        </div>
      </div>
    </div>
  );
  const spans=job.trace_spans||[];
  const maxDur=Math.max(...spans.map(s=>s.duration_ms||0),1);
  const logMatch=job.fact_sheet?.raw_markdown?.match(/```\n([\s\S]*?)```/);
  const logs=logMatch?logMatch[1].trim():'';
  const cves=job.context?.cve_matches||
    (job.fact_sheet?.raw_markdown?.match(/## CVE Matches\n([\s\S]*?)\n## /)?.[1]||'')
      .split('\n').filter(l=>l.includes('CVE')).map(l=>l.replace(/^  - /,'').trim());
  const intel=(job.fact_sheet?.raw_markdown?.match(/## Threat Intelligence\n([\s\S]*?)\n## /)?.[1]||'')
    .split('\n').filter(l=>l.trim().startsWith('-')).map(l=>l.replace(/^  - \[.*?\] /,'').trim()).slice(0,3);

  return(
    <div className="right">
      {spans.length>0&&(
        <div className="right-section">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div className="r-title" style={{marginBottom:0}}>Omium Trace Viewer</div>
            <span style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--c2)',
              background:'rgba(0,255,136,.08)',border:'1px solid rgba(0,255,136,.2)',
              borderRadius:2,padding:'2px 7px',letterSpacing:1}}>✓ SHIPPED</span>
          </div>
          <div style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:4,overflow:'hidden',marginBottom:10}}>
            <div style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',
              display:'flex',justifyContent:'space-between',
              fontFamily:'var(--font-mono)',fontSize:9,color:'var(--txd)',letterSpacing:1}}>
              <span>AGENT · OPERATION</span><span>TIMELINE</span><span>DURATION</span>
            </div>
            {spans.map((s,i)=>{
              const totalDur=spans.reduce((a,b)=>a+(b.duration_ms||0),0);
              const offset=spans.slice(0,i).reduce((a,b)=>a+(b.duration_ms||0),0);
              const pct=Math.max((s.duration_ms/maxDur)*100,3);
              const offPct=(offset/Math.max(totalDur,1))*100;
              return(
              <div key={i} style={{padding:'8px 12px',borderBottom:i<spans.length-1?'1px solid var(--border)':'',
                background:s.error?'rgba(255,71,87,.04)':'transparent'}}>
                <div style={{display:'flex',justifyContent:'space-between',
                  alignItems:'center',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{color:AGENT_COLORS[s.agent]||'var(--c)',
                      fontFamily:'var(--font-mono)',fontSize:10,fontWeight:700}}>
                      {AGENT_ICONS[s.agent]} {s.agent}
                    </span>
                    <span style={{fontFamily:'var(--font-mono)',fontSize:9,
                      color:'var(--txd)'}}>· {s.operation}</span>
                  </div>
                  <span style={{fontFamily:'var(--font-mono)',fontSize:10,
                    color:s.error?'var(--c3)':(s.duration_ms>1000?'var(--c4)':' var(--c2)')}}>
                    {(s.duration_ms||0).toFixed(0)}ms
                  </span>
                </div>
                <div style={{position:'relative',height:6,background:'var(--bg3)',borderRadius:2}}>
                  <div style={{
                    position:'absolute',left:`${offPct}%`,
                    width:`${pct}%`,height:'100%',borderRadius:2,
                    background:s.error
                      ?'linear-gradient(90deg,#ff4757,#ff8c00)'
                      :`linear-gradient(90deg,${AGENT_COLORS[s.agent]||'var(--c)'}99,${AGENT_COLORS[s.agent]||'var(--c)'})`
                  }}/>
                </div>
                {s.error&&(
                  <div style={{marginTop:5,fontFamily:'var(--font-mono)',fontSize:9,
                    color:'var(--c3)',lineHeight:1.5}}>
                    ⚠ {s.error.slice(0,80)}{s.error.length>80?'…':''}
                  </div>
                )}
                {s.result&&!s.error&&(
                  <div style={{marginTop:4,fontFamily:'var(--font-mono)',fontSize:9,
                    color:'var(--txd)',lineHeight:1.5}}>
                    → {String(s.result).slice(0,70)}{String(s.result).length>70?'…':''}
                  </div>
                )}
              </div>
            );})}
          </div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,color:'var(--txd)',
            display:'flex',justifyContent:'space-between'}}>
            <span>Total: {spans.reduce((a,b)=>a+(b.duration_ms||0),0).toFixed(0)}ms</span>
            <span>{spans.length} spans · {spans.filter(s=>s.error).length} errors</span>
          </div>
        </div>
      )}

      {logs&&(
        <div className="right-section">
          <div className="r-title">Raw Logs</div>
          <pre className="log-pre">{logs}</pre>
        </div>
      )}

      {intel.length>0&&(
        <div className="right-section">
          <div className="r-title">Threat Intel</div>
          {intel.map((s,i)=>(
            <div className="intel-item" key={i}>{s.slice(0,180)}{s.length>180?'…':''}</div>
          ))}
        </div>
      )}

      {Array.isArray(cves)&&cves.filter(Boolean).length>0&&(
        <div className="right-section">
          <div className="r-title">CVE Matches</div>
          {cves.filter(Boolean).map((c,i)=>(
            <div className="intel-item" key={i} style={{borderLeftColor:'rgba(255,165,2,.4)',color:'#ffa502'}}>{c}</div>
          ))}
        </div>
      )}

      <div className="right-section">
        <div className="r-title">Job Info</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {[
            ['ID', shortId(job.job_id)],
            ['Status', job.status?.toUpperCase()],
            ['Events', job.messages?.length||0],
            ['Spans', spans.length],
            ['Omium Trace', spans.length>0?'✓ Shipped':'—'],
            ['Discord Alert', job.fact_sheet?'✓ Fired':'—'],
          ].map(([k,v])=>(
            <div key={k} style={{display:'flex',justifyContent:'space-between',
              fontFamily:'var(--font-mono)',fontSize:10,paddingBottom:2}}>
              <span style={{color:'var(--txd)'}}>{k}</span>
              <span style={{color:(k==='Omium Trace'||k==='Discord Alert')&&v.startsWith('✓')?'var(--c2)':'var(--tx)'}}>{v}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const[jobs,setJobs]=useState([]);
  const[selId,setSelId]=useState(null);
  const[selJob,setSelJob]=useState(null);
  const[input,setInput]=useState('');
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState(null);
  const pollRef=useRef(null);

  const pollJob=useCallback(async(jobId)=>{
    if(pollRef.current)clearInterval(pollRef.current);
    pollRef.current=setInterval(async()=>{
      try{
        const r=await fetch(`${API}/api/v1/jobs/${jobId}`);
        const d=await r.json();
        setJobs(prev=>prev.map(j=>j.id===jobId?{...j,status:d.status,data:d}:j));
        setSelId(jobId);
        setSelJob(d);
        if(['complete','failed'].includes(d.status))clearInterval(pollRef.current);
      }catch{clearInterval(pollRef.current);}
    },1000);
  },[selId]);

  const submit=async()=>{
    if(!input.trim()||busy)return;
    setBusy(true);setErr(null);
    try{
      const r=await fetch(`${API}/api/v1/jobs`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({problem_statement:input.trim()})
      });
      const d=await r.json();
      const nj={id:d.job_id,status:'pending',problem:input.trim(),data:null};
      setJobs(p=>[nj,...p]);
      setSelId(d.job_id);setSelJob(null);setInput('');
      pollJob(d.job_id);
    }catch{setErr('Backend unreachable. Is the server running?');}
    finally{setBusy(false);}
  };

  const selectJob=async(jobId)=>{
    setSelId(jobId);
    const ex=jobs.find(j=>j.id===jobId);
    if(ex?.data){setSelJob(ex.data);return;}
    setSelJob(null);
    try{
      const r=await fetch(`${API}/api/v1/jobs/${jobId}`);
      const d=await r.json();
      setSelJob(d);
      setJobs(p=>p.map(j=>j.id===jobId?{...j,data:d}:j));
      if(!['complete','failed'].includes(d.status))pollJob(jobId);
    }catch{}
  };

  useEffect(()=>{
    fetch(`${API}/api/v1/jobs`).then(r=>r.json())
      .then(d=>setJobs(d.map(j=>({id:j.job_id,status:j.status,problem:'',data:null}))))
      .catch(()=>{});
    return()=>{if(pollRef.current)clearInterval(pollRef.current);};
  },[]);

  // ── Monitor.py queue polling — auto-submit alerts from the proxy ──────────
  const queueRef=useRef(null);
  useEffect(()=>{
    queueRef.current=setInterval(async()=>{
      try{
        const r=await fetch(`${API}/api/v1/queue`);
        const d=await r.json();
        if(d.alert){
          // Auto-submit the alert as a job
          const res=await fetch(`${API}/api/v1/jobs`,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({problem_statement:d.alert})
          });
          const job=await res.json();
          const nj={id:job.job_id,status:'pending',problem:d.alert,data:null};
          setJobs(p=>[nj,...p]);
          setSelId(job.job_id);setSelJob(null);
          pollJob(job.job_id);
        }
      }catch{}
    },3000);
    return()=>clearInterval(queueRef.current);
  },[pollJob]);

  const job=selJob;
  const isLive=job&&['pending','running','looping'].includes(job.status);

  return(
    <div id="app" style={{height:'100%',display:'flex',flexDirection:'column'}}>
      {/* HEADER */}
      <header className="hdr">
        <div className="hdr-logo">
          <div className="hdr-shield">
            <svg viewBox="0 0 32 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 2L3 8v10c0 8.3 5.6 16.1 13 18.4C23.4 34.1 29 26.3 29 18V8L16 2z"
                stroke="var(--c)" strokeWidth="1.5" fill="rgba(0,229,255,0.06)"/>
              <path d="M11 17l3.5 3.5L21 12" stroke="var(--c)" strokeWidth="2"
                strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <div>
            <div className="brand">Sentinel-Ops</div>
            <div className="brand-sub">Neural Threat Command · v0.3</div>
          </div>
        </div>
        <div className="hdr-right">
          <div className="sys-stat"><span className="dot-live"/>System Online</div>
          <div className="sys-stat" style={{color:'var(--txd)'}}>
            Jobs: {jobs.length}
          </div>
          <Clock/>
        </div>
      </header>

      {/* LAYOUT */}
      <div className="layout">

        {/* LEFT */}
        <aside className="left">
          <div className="submit-zone">
            <div className="panel-label">Submit Threat Alert</div>
            <textarea className="threat-area"
              placeholder={"Describe the threat or paste raw alert data...\n\ne.g. SSH brute-force from 203.0.113.42, CVE-2023-38408 detected"}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==='Enter'&&e.ctrlKey)submit();}}
            />
            <button className="launch-btn" onClick={submit} disabled={busy||!input.trim()}>
              {busy?'Initiating…':'⬡ Initiate Hunt'}
            </button>
            {err&&<div className="err-bar" style={{margin:'10px 0 0',padding:'8px 12px',
              borderRadius:3,fontSize:10,fontFamily:'var(--font-mono)'}}>⚠ {err}</div>}
          </div>

          <div className="jobs-header">
            <div className="panel-label">Job Queue — {jobs.length}</div>
          </div>
          <div className="job-scroll">
            {jobs.length===0&&(
              <div style={{textAlign:'center',color:'var(--txd)',fontSize:10,
                fontFamily:'var(--font-mono)',padding:20,letterSpacing:1}}>
                No jobs submitted yet
              </div>
            )}
            {jobs.map(j=>(
              <div key={j.id}
                className={`job-card ${selId===j.id?'sel':''}`}
                onClick={()=>selectJob(j.id)}>
                <div className="job-card-top">
                  <span className="job-short">#{shortId(j.id)}</span>
                  <Badge status={j.status} severity={j.data?.fact_sheet?.severity}/>
                </div>
                <div className="job-excerpt">
                  {j.problem||j.data?.fact_sheet?.summary?.slice(0,80)||j.id}
                </div>
              </div>
            ))}
          </div>
        </aside>

        {/* CENTER */}
        <main className="center">
          <div className="center-inner">
            {!selId&&(
              <div className="empty-center">
                <div className="empty-glyph">◈</div>
                <div className="empty-title">Awaiting Threat Input</div>
                <div className="empty-hint">
                  Submit an alert or log description to initiate autonomous multi-agent threat hunting
                </div>
              </div>
            )}

            {selId&&!job&&(
              <div className="empty-center">
                <div className="spin" style={{width:28,height:28,borderWidth:3}}/>
                <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--txd)'}}>
                  Loading…
                </div>
              </div>
            )}

            {job&&(
              <>
                {/* Pipeline viz */}
                <div className="pipeline-wrap">
                  <div className="pipeline-title-row">
                    <span className="pipe-title">Agent Pipeline</span>
                    <Badge status={job.status} severity={job.fact_sheet?.severity}/>
                  </div>
                  <Pipeline messages={job.messages} spans={job.trace_spans} status={job.status}/>
                </div>

                {/* Live indicator */}
                {isLive&&(
                  <div className="live-bar">
                    <div className="spin"/><span>Agents running — auto-refreshing every second</span>
                  </div>
                )}

                {job.error&&(
                  <div className="err-bar">⚠ {job.error}</div>
                )}

                {/* Messages */}
                {job.messages?.length>0&&(
                  <>
                    <div className="sec-divider"/>
                    <Messages messages={job.messages}/>
                  </>
                )}

                {/* Fact sheet */}
                {job.fact_sheet&&(
                  <>
                    <div className="sec-divider"/>
                    <FactSheet fs={job.fact_sheet}/>
                  </>
                )}
              </>
            )}
          </div>
        </main>

        {/* RIGHT */}
        <RightPanel job={selJob}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
